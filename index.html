<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Web Navbar Clone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utils.css">
    <script src="https://kit.fontawesome.com/67dca9aac4.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav class="navbar display">
            <div class="left">
                <div id="logo">
                    <img src="img/logo.png" alt="">
                </div>
                <ul class="list-item">
                    <li class="item"><a class="red" href="">MEN</a></li>
                    <li class="item"><a class="pink" href="">WOMEN</a></li>
                    <li class="item"><a class="orange" href="">KIDS</a></li>
                    <li class="item"><a class="yellow" href="">HOME & LIVING</a></li>
                    <li class="item"><a class="green" href="">BEAUTY</a></li>
                    <li class="item"><a class="pink1" href="">STUDIO<sup>NEW</sup></a></li>
                </ul>
            </div>
            <div class="middle">
                <div class="input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" name="text" id="input" class="fa-light fa-magnifying-glass"
                        placeholder="Search for products, brands and more">
                </div>
            </div>
            <div class="right">
                <div class="icon">
                    <div class="icon1 red flex">
                        <i class="icon1 fa-regular fa-user"></i>
                        <span>Profile</span>
                    </div>
                    <div class="icon2 flex">
                        <i class="icon2 fa-regular fa-heart"></i>
                        <span>Whislist</span>
                    </div>
                    <div class="icon3 flex">
                        <i class="icon3 fa-solid fa-bag-shopping"></i>
                        <span>Bag</span>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <section class=" section1">
        <img class="img1" src="img/img1.webp" alt="img">
        <img class="img2" src="img/section1.png" alt="img">
        <img class="img3" src="img/cuponcorner.webp" alt="img">
    </section>
    <section class="section2">
        <img src="img/cupon1.webp" alt="img">
        <img src="img/cupon2.webp" alt="img">
    </section>
    <section class="section3">
        <img src="img/offer.webp" alt="img">
        <img src="img/section2.webp" alt="img">
        <img src="img/img3.webp" alt="">
    </section>
    <section class="section4">

                <img src="img/card/2.2.webp" alt="">
                <img src="img/card/2.3.webp" alt="">
                <img src="img/card/2.5.webp" alt="">
                <img src="img/card/2.5.webp" alt="">
                <img src="img/card/2.6.webp" alt="">
              </div>
              <div class="swiper-slide">

            </div>
            <div class="swiper-pagination"></div>
          </div>        
    </section>
    <section class="section5">
        <img src="img/cart.webp" alt="">
        <div class="card-img">
